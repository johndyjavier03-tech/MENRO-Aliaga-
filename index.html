<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Log</title>
<!--
  BUDGET LOG (local): single file, no server, no account.
  Data is saved in this browser (localStorage). Open the file, or host it on GitHub Pages.
  Use "Download backup" (an Excel file) to move data to another device or browser, and "Restore backup" to load it.
-->
<style>
:root{--bg:#f6f7f8;--ink:#1c2024;--mute:#6b7480;--line:#e3e6ea;--in:#15803d;--out:#b4412e;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
h1,h2{font-weight:600}h2{font-size:17px;margin:0}small{color:var(--mute);font-weight:400}
.in{color:var(--in)}.out{color:var(--out)}.mute{color:var(--mute)}.pad{padding:40px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
nav>b{padding:0 10px 14px}nav button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;color:var(--mute)}
nav button.on{background:var(--bg);color:var(--ink);font-weight:600}.who{margin-top:auto;padding:10px;font-size:13px}.who button{padding:6px 0;text-decoration:underline}
main{padding:28px;max-width:960px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}.cards span{color:var(--mute);font-size:13px;display:block}.cards b{font-size:22px;font-weight:500}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.bar h2{margin-right:auto}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
button.primary{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5}
button.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit}button.link.out{color:var(--out)}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.grid label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}.row{display:flex;gap:12px;align-items:end}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px}th{text-align:left;color:var(--mute);font-weight:500;font-size:13px}th,td{padding:9px 12px;border-bottom:1px solid var(--line)}.act{white-space:nowrap;text-align:right}
details summary{display:flex;gap:16px;align-items:baseline;cursor:pointer}details summary span{margin-left:auto;color:var(--mute);font-size:13px}details em{font-size:12px;color:var(--out)}details table{margin-top:10px}
.warn{background:#fdecea;color:var(--out);padding:10px 14px;border-radius:8px}
.auth{max-width:340px;margin:12vh auto;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px}.toast.bad{background:var(--out)}
@media(max-width:700px){.shell{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav>b,.who{display:none}nav button{white-space:nowrap}main{padding:16px}}
.filebtn{display:block;padding:6px 0;text-decoration:underline;cursor:pointer;color:var(--mute)}.who small{display:block;margin-bottom:6px}
.chk .row.add{margin-top:12px;align-items:center}.chk td.c,.chk th.c{text-align:center}.chk .sel{background:var(--bg)}.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--in);cursor:pointer}.chk p{margin:6px 0}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="text/babel" data-presets="react">
const { useEffect, useMemo, useState, useCallback } = React

// ---------- Local storage layer (replace this block to use another database later) ----------
const KEY = 'budget-log-v1'
const seed = () => {
  const c = [[1,5000],[2,4500],[3,5500],[4,4000]].map(([w, a], i) => ({ id: i + 1, week_number: w, collection_date: `2026-10-0${w}`, description: `Week ${w} collection`, amount: a, person_responsible: null, is_sample: true }))
  const e = [['John','Office','Bond Paper and Printing',350],['John','Transport','Transportation',200],['Mark','Transport','Transportation Fare',500],['James','Supplies','Cleaning Materials',750],['Peter','Food','Food and Refreshments',1000],['John','Office','Office Supplies',450],['Mark','Other','Miscellaneous',250]]
    .map(([p, cat, n, a], i) => ({ id: 100 + i, expense_date: '2026-10-05', person_name: p, category: cat, expense_name: n, amount: a, is_sample: true }))
  return norm({ collections: c, expenses: e, next: 1000 })
}
const read = () => { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.collections && d.expenses) return norm(d) } catch {} const d = seed(); write(d); return d }
const write = d => { try { localStorage.setItem(KEY, JSON.stringify(d)) } catch { throw new Error('This browser blocked saving data.') } }
const DEFAULT_MEMBERS = ['Nella','Mila','Daniella','Derick','Adriane','Mj','Andrew','Jm','Jarred','Charles','Vince']
const norm = d => { d.members ||= DEFAULT_MEMBERS.map((n, i) => ({ id: 500 + i, name: n })); d.payments ||= {}; d.weeks ||= 4; return d }
const total = rows => rows.reduce((t, r) => t + Number(r.amount), 0)

// Keep the payment checklist in step with collection records
function syncChecklist(d, old, cur) {
  const key = n => String(n ?? '').toLowerCase()
  const member = n => n && d.members.find(m => key(m.name) === key(n))
  if (old) {
    const m = member(old.person_responsible)
    const still = d.collections.some(r => key(r.person_responsible) === key(old.person_responsible) && Number(r.week_number) === Number(old.week_number))
    if (m && !still) delete d.payments[m.id + '|' + old.week_number]
  }
  if (cur) {
    const m = member(cur.person_responsible)
    if (m) { d.payments[m.id + '|' + cur.week_number] = true; d.weeks = Math.max(d.weeks, Number(cur.week_number)) }
  }
}

const table = (name, dateCol, sync) => ({
  async list() { return [...read()[name]].sort((a, b) => b[dateCol].localeCompare(a[dateCol]) || b.id - a.id) },
  async save({ id, ...row }) {
    const d = read(), list = d[name], old = id ? list.find(r => r.id === id) : null
    const cur = id ? { ...old, ...row } : { ...row, id: ++d.next }
    d[name] = id ? list.map(r => r.id === id ? cur : r) : [...list, cur]
    if (sync) sync(d, old, cur)
    write(d)
  },
  async remove(id) { const d = read(), old = d[name].find(r => r.id === id); d[name] = d[name].filter(r => r.id !== id); if (sync) sync(d, old, null); write(d) },
})
const db = { collections: table('collections', 'collection_date', syncChecklist), expenses: table('expenses', 'expense_date'),
  pay: () => { const d = read(); return { members: d.members, payments: d.payments, weeks: d.weeks } },
  addMember(name) { name = name.trim(); if (!name) throw new Error('Enter a name.'); const d = read(); if (d.members.some(m => m.name.toLowerCase() === name.toLowerCase())) throw new Error(`${name} is already on the list.`); d.members.push({ id: ++d.next, name }); write(d) },
  removeMember(id) { const d = read(); d.members = d.members.filter(m => m.id !== id); Object.keys(d.payments).forEach(k => { if (k.startsWith(id + '|')) delete d.payments[k] }); write(d) },
  setPaid(id, w, v) { const d = read(), k = id + '|' + w; if (v) d.payments[k] = true; else delete d.payments[k]; write(d) },
  addWeek() { const d = read(); d.weeks++; write(d) },
  exportXlsx(stamp) {
    const d = read(), X = XLSX, wb = X.utils.book_new(), PESO = '"₱"#,##0.00'
    const cmp = (a, b) => String(a).localeCompare(String(b))
    const cols = [...d.collections].sort((a, b) => Number(a.week_number) - Number(b.week_number) || cmp(a.collection_date, b.collection_date) || a.id - b.id)
    const exps = [...d.expenses].sort((a, b) => cmp(a.expense_date, b.expense_date) || a.id - b.id)
    const c = total(cols), e = total(exps)
    const widths = rows => Array.from({ length: Math.max(...rows.map(r => r.length)) }, (_, i) => ({ wch: Math.min(45, Math.max(10, ...rows.map(r => String(r[i] ?? '').length + 2))) }))
    // plain sheet with column widths, optional filter buttons and peso format on money columns
    const make = (rows, money = [], filter = true) => {
      const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = widths(rows)
      if (filter) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length - 1, c: rows[0].length - 1 } }) }
      rows.forEach((_, r) => money.forEach(cc => { const cell = ws[X.utils.encode_cell({ r, c: cc })]; if (r > 0 && cell && cell.t === 'n') cell.z = PESO }))
      return ws
    }
    const setF = (ws, list) => list.forEach(([addr, f, v, z]) => { ws[addr] = { t: 'n', f, v, ...(z ? { z } : {}) } })

    // Collections: one row per payment received, grouped by week
    const wsC = make([['ID', 'Week', 'Date', 'Person', 'Remarks', 'Amount (₱)', 'Sample data'],
      ...cols.map(r => [r.id, Number(r.week_number), r.collection_date, r.person_responsible ?? '', r.description ?? '', Number(r.amount), r.is_sample ? 'Yes' : ''])], [5])
    // Expenses: one row per expense, oldest first
    const wsE = make([['ID', 'Date', 'Person', 'Category', 'Expense', 'Details', 'Quantity', 'Amount (₱)', 'Receipt ref.', 'Remarks', 'Sample data'],
      ...exps.map(r => [r.id, r.expense_date, r.person_name, r.category ?? '', r.expense_name, r.description ?? '', r.quantity ?? '', Number(r.amount), r.receipt_reference ?? '', r.remarks ?? '', r.is_sample ? 'Yes' : ''])], [7])
    // Checklist: names down, weeks across
    const weeks = Array.from({ length: d.weeks }, (_, i) => i + 1), isPaid = (m, w) => !!d.payments[m.id + '|' + w]
    const wsK = make([['Name', ...weeks.map(w => 'Week ' + w), 'Weeks paid'],
      ...d.members.map(m => [m.name, ...weeks.map(w => isPaid(m, w) ? 'Yes' : ''), weeks.filter(w => isPaid(m, w)).length])])

    // By Person: each person's expenses together with a subtotal
    const people = {}; exps.forEach(x => (people[x.person_name.trim()] ||= []).push(x))
    const names = Object.keys(people).sort((a, b) => total(people[b]) - total(people[a]))
    const P = [['Person', 'Date', 'Expense', 'Category', 'Amount (₱)']], subs = []
    names.forEach(n => {
      const start = P.length
      people[n].forEach(x => P.push([n, x.expense_date, x.expense_name, x.category ?? '', Number(x.amount)]))
      subs.push([`E${P.length + 1}`, `SUM(E${start + 1}:E${P.length})`, total(people[n]), PESO])
      P.push([`Total for ${n}`, '', '', '', total(people[n])]); P.push([])
    })
    P.push(['All people', '', '', '', e])
    const wsP = make(P, [4], false); wsP['!cols'][0].wch = Math.max(wsP['!cols'][0].wch, 16)
    setF(wsP, [...subs, [`E${P.length}`, 'SUM(Expenses!H2:H5000)', e, PESO]])

    // Summary: totals, collected per week, expenses per person and category
    const S = [['Budget Log Backup'], ['Created', stamp], [], ['Overview'], ['Total collected', c], ['Total expenses', e], ['Remaining budget', c - e], [], ['Collected by week'], ['Week', 'Collected (₱)', 'Members paid', 'Not yet paid', 'Paid (names)', 'Not yet paid (names)']]
    const F = [['B5', 'SUM(Collections!F2:F5000)', c, PESO], ['B6', 'SUM(Expenses!H2:H5000)', e, PESO], ['B7', 'B5-B6', c - e, PESO]], money = []
    weeks.forEach(w => {
      const row = S.length + 1, L = X.utils.encode_col(w), paid = d.members.filter(m => isPaid(m, w)).length
      S.push([w, total(cols.filter(r => Number(r.week_number) === w)), paid, d.members.length - paid, d.members.filter(m => isPaid(m, w)).map(m => m.name).join(', ') || '-', d.members.filter(m => !isPaid(m, w)).map(m => m.name).join(', ') || '-'])
      F.push([`B${row}`, `SUMIF(Collections!B$2:B$5000,A${row},Collections!F$2:F$5000)`, S[S.length - 1][1], PESO], [`C${row}`, `COUNTIF(Checklist!${L}$2:${L}$500,"Yes")`, paid], [`D${row}`, `COUNTA(Checklist!A$2:A$500)-C${row}`, d.members.length - paid])
    })
    S.push([], ['Expenses by person'], ['Person', 'Number of expenses', 'Total (₱)', 'Items bought'])
    names.forEach(n => { S.push([n, people[n].length, total(people[n]), people[n].map(x => x.expense_name).join(', ')]); money.push(`C${S.length}`) })
    const cats = {}; exps.forEach(x => { const k = (x.category || 'Uncategorized').trim(); cats[k] = (cats[k] || 0) + Number(x.amount) })
    S.push([], ['Expenses by category'], ['Category', '', 'Total (₱)'])
    Object.entries(cats).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => { S.push([k, '', v]); money.push(`C${S.length}`) })
    const wsS = make(S, [], false); wsS['!cols'] = [{ wch: 24 }, { wch: 20 }, { wch: 16 }, { wch: 16 }, { wch: 48 }, { wch: 48 }]
    setF(wsS, F); money.forEach(a => { if (wsS[a]) wsS[a].z = PESO })

    // Names Summary: one row per person with what they paid each week, weeks missed and what they spent
    const key = n => String(n ?? '').trim().toLowerCase(), who = new Map()
    const touch = n => { if (key(n) && !who.has(key(n))) who.set(key(n), String(n).trim()) }
    d.members.forEach(m => touch(m.name)); cols.forEach(r => touch(r.person_responsible)); exps.forEach(r => touch(r.person_name))
    const N = [['Name', ...weeks.map(w => 'Week ' + w), 'Total collected (₱)', 'Weeks paid', 'Not yet paid for', 'Total expenses (₱)']]
    for (const [k, name] of who) {
      const m = d.members.find(x => key(x.name) === k)
      N.push([name, ...weeks.map(w => total(cols.filter(r => key(r.person_responsible) === k && Number(r.week_number) === w))),
        total(cols.filter(r => key(r.person_responsible) === k)), m ? weeks.filter(w => isPaid(m, w)).length : 0,
        m ? weeks.filter(w => !isPaid(m, w)).map(w => 'Week ' + w).join(', ') : '', total(exps.filter(r => key(r.person_name) === k))])
    }
    const nm = weeks.length, last = nm + 4, moneyCols = [...weeks.map((_, i) => i + 1), nm + 1, last]
    N.push(['All names', ...Array(last).fill('')])
    const wsN = make(N, moneyCols); const nFirst = 2, nLast = N.length - 1
    wsN['!autofilter'].ref = X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: nLast - 1, c: last } })   // filter the people, not the total row
    setF(wsN, moneyCols.map(c => { const L = X.utils.encode_col(c); return [`${L}${N.length}`, `SUM(${L}${nFirst}:${L}${nLast})`, N.slice(1, -1).reduce((t, r) => t + Number(r[c]), 0), PESO] }))

    X.utils.book_append_sheet(wb, wsS, 'Summary')
    X.utils.book_append_sheet(wb, wsN, 'Names Summary')
    X.utils.book_append_sheet(wb, wsC, 'Collections')
    X.utils.book_append_sheet(wb, wsE, 'Expenses')
    X.utils.book_append_sheet(wb, wsP, 'By Person')
    X.utils.book_append_sheet(wb, wsK, 'Checklist')
    X.writeFile(wb, `budget-log-${stamp}.xlsx`)
  },
  importXlsx(buf) {
    // Reads Collections, Expenses and Checklist. Summary and By Person are reports and are ignored.
    const X = XLSX, wb = X.read(buf, { type: 'array', cellDates: true })
    const rows = n => { if (!wb.Sheets[n]) throw new Error(`The sheet "${n}" is missing. Use a backup made by this app.`); return X.utils.sheet_to_json(wb.Sheets[n], { defval: null }) }
    const pick = (r, ...keys) => { for (const k of keys) if (r[k] != null && r[k] !== '') return r[k]; return null }
    const ds = v => v instanceof Date ? `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}` : String(v ?? '').slice(0, 10)
    const txt = v => v == null || v === '' ? null : String(v)
    const yes = v => v === true || /^(true|yes)$/i.test(String(v))
    const col = rows('Collections').map(r => ({ id: Number(pick(r, 'ID', 'id')) || 0, week_number: Number(pick(r, 'Week', 'week_number')), collection_date: ds(pick(r, 'Date', 'collection_date')), description: txt(pick(r, 'Remarks', 'description')), amount: Number(pick(r, 'Amount (₱)', 'amount')), person_responsible: txt(pick(r, 'Person', 'person_responsible')), is_sample: yes(pick(r, 'Sample data', 'is_sample')) }))
      .filter(r => r.amount > 0 && r.week_number > 0 && r.collection_date)
    const exp = rows('Expenses').map(r => ({ id: Number(pick(r, 'ID', 'id')) || 0, expense_date: ds(pick(r, 'Date', 'expense_date')), person_name: txt(pick(r, 'Person', 'person_name')), category: txt(pick(r, 'Category', 'category')), expense_name: txt(pick(r, 'Expense', 'expense_name')), description: txt(pick(r, 'Details', 'description')), quantity: pick(r, 'Quantity', 'quantity') == null ? null : Number(pick(r, 'Quantity', 'quantity')), amount: Number(pick(r, 'Amount (₱)', 'amount')), receipt_reference: txt(pick(r, 'Receipt ref.', 'receipt_reference')), remarks: txt(pick(r, 'Remarks', 'remarks')), is_sample: yes(pick(r, 'Sample data', 'is_sample')) }))
      .filter(r => r.amount > 0 && r.person_name && r.expense_name && r.expense_date)
    let next = Math.max(1000, ...col.map(r => r.id), ...exp.map(r => r.id))
    col.concat(exp).forEach(r => { if (!r.id) r.id = ++next })
    let members, payments = {}, weeks
    if (wb.Sheets.Checklist) {
      const a = X.utils.sheet_to_json(wb.Sheets.Checklist, { header: 1, defval: '' }), head = a[0] || []
      const wc = head.map((h, i) => [String(h).trim().match(/^(?:W|Week )(\d+)$/i), i]).filter(([m]) => m).map(([m, i]) => [Number(m[1]), i])
      weeks = Math.max(1, ...wc.map(([w]) => w)); members = []
      a.slice(1).filter(r => String(r[0]).trim()).forEach(r => {
        const id = ++next; members.push({ id, name: String(r[0]).trim() })
        wc.forEach(([w, i]) => { const v = String(r[i]).trim(); if (v && !/^(no|0|false)$/i.test(v)) payments[id + '|' + w] = true })
      })
    }
    write(norm({ collections: col, expenses: exp, next, members, payments, weeks }))
  },
  exportAll: () => JSON.stringify(read(), null, 2),
  importAll(text) { const d = JSON.parse(text); if (!Array.isArray(d.collections) || !Array.isArray(d.expenses)) throw new Error('This file is not a Budget Log backup.'); write(norm({ next: 1000, ...d })) },
  clearSample() { const d = read(); d.collections = d.collections.filter(r => !r.is_sample); d.expenses = d.expenses.filter(r => !r.is_sample); write(d) } }

const peso = n => new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(n || 0)
const sum = total
const today = () => new Date().toISOString().slice(0, 10)

// ---------- Interface ----------
// Reusable add / edit / delete table for both collections and expenses
function Crud({ title, rows, fields, show, store, admin, notify, tone, available }) {
  const blank = Object.fromEntries(fields.map(f => [f.k, f.def ?? '']))
  const [form, setForm] = useState(null), [q, setQ] = useState('')
  const shown = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q.toLowerCase()))
  async function save(e) {
    e.preventDefault()
    const amt = Number(form.amount)
    if (!(amt > 0)) return notify('Amount must be greater than zero.', true)
    try { await store.save({ ...form, amount: amt }); setForm(null); notify('Saved.') } catch (err) { notify(err.message, true) }
  }
  async function del(r) { if (confirm('Delete this record?')) try { await store.remove(r.id); notify('Deleted.') } catch (err) { notify(err.message, true) } }
  return <section>
    <div className="bar"><h2>{title} <small>({rows.length})</small></h2><input placeholder="Search…" value={q} onChange={e => setQ(e.target.value)} /><button className="primary" onClick={() => setForm({ ...blank })}>Add</button></div>
    {form && <form className="card grid" onSubmit={save}>
      {fields.map(f => <label key={f.k}>{f.label}{f.type === 'select'
        ? <select value={form[f.k] ?? ''} onChange={e => setForm({ ...form, [f.k]: e.target.value || null })}><option value="">Choose a name</option>{[...new Set([...(f.options || []), form[f.k]].filter(Boolean))].map(o => <option key={o}>{o}</option>)}</select>
        : <input type={f.type || 'text'} step={f.type === 'number' ? '0.01' : undefined} required={f.req} value={form[f.k] ?? ''} onChange={e => setForm({ ...form, [f.k]: e.target.value === '' && !f.req ? null : e.target.value })} />}</label>)}
      <div className="row"><button className="primary">Save</button><button type="button" className="link" onClick={() => setForm(null)}>Cancel</button></div>
    </form>}
    <div className="scroll"><table><thead><tr>{show.map(s => <th key={s.k}>{s.label}</th>)}<th /></tr></thead><tbody>
      {shown.map(r => <tr key={r.id}>{show.map(s => <td key={s.k} className={s.k === 'amount' ? tone : ''}>{s.k === 'amount' ? peso(r[s.k]) : r[s.k]}</td>)}
        <td className="act">{admin ? <><button className="link" onClick={() => setForm(r)}>Edit</button><button className="link out" onClick={() => del(r)}>Delete</button></> : null}</td></tr>)}
      {!shown.length && <tr><td colSpan={show.length + 1} className="mute">Nothing here yet.</td></tr>}
    </tbody></table></div>
  </section>
}


// Who has paid, week by week. Names can be added or removed; ticks are saved automatically.
function Checklist({ pay, reload, notify }) {
  const [name, setName] = useState(''), [sel, setSel] = useState(null)
  const weeks = Array.from({ length: pay.weeks }, (_, i) => i + 1), w = sel ?? pay.weeks
  const isPaid = (m, wk) => !!pay.payments[m + '|' + wk]
  const unpaid = pay.members.filter(m => !isPaid(m.id, w))
  const run = async fn => { try { fn(); await reload(); return true } catch (e) { notify(e.message, true); return false } }
  return <div className="card chk">
    <div className="bar"><h2>Payment checklist</h2>
      <select aria-label="Week" value={w} onChange={e => setSel(Number(e.target.value))}>{weeks.map(x => <option key={x} value={x}>Week {x}</option>)}</select>
      <button className="link" onClick={() => run(() => { db.addWeek(); setSel(pay.weeks + 1) })}>Add week</button></div>
    <p><b className="in">{pay.members.length - unpaid.length} paid</b>, <b className="out">{unpaid.length} not yet paid</b> <span className="mute">for Week {w}</span></p>
    <p className="mute">{unpaid.length ? 'Waiting on: ' + unpaid.map(m => m.name).join(', ') : 'Everyone has paid for this week.'}</p>
    <div className="scroll"><table><thead><tr><th>Name</th>{weeks.map(x => <th key={x} className={'c' + (x === w ? ' sel' : '')}>W{x}</th>)}<th className="c">Paid</th><th /></tr></thead>
      <tbody>{pay.members.map(m => <tr key={m.id}><td>{m.name}</td>
        {weeks.map(x => <td key={x} className={'c' + (x === w ? ' sel' : '')}><input type="checkbox" aria-label={`${m.name}, week ${x}`} checked={isPaid(m.id, x)} onChange={e => run(() => db.setPaid(m.id, x, e.target.checked))} /></td>)}
        <td className="c">{weeks.filter(x => isPaid(m.id, x)).length}/{pay.weeks}</td>
        <td className="act"><button className="link out" onClick={() => confirm(`Remove ${m.name} from the list?`) && run(() => db.removeMember(m.id))}>Remove</button></td></tr>)}
        {!pay.members.length && <tr><td colSpan={pay.weeks + 3} className="mute">No names yet. Add the first one below.</td></tr>}</tbody></table></div>
    <form className="row add" onSubmit={async e => { e.preventDefault(); if (await run(() => db.addMember(name))) setName('') }}>
      <input placeholder="Add a name" aria-label="New name" value={name} onChange={e => setName(e.target.value)} /><button className="primary">Add name</button></form>
  </div>
}

function Dashboard({ cols, exps, extra }) {
  const c = sum(cols), s = sum(exps), rem = c - s
  const recent = [...cols.map(x => ({ ...x, type: 'in', date: x.collection_date, who: x.person_responsible || '', label: x.description || `Week ${x.week_number}` })), ...exps.map(x => ({ ...x, type: 'out', date: x.expense_date, who: x.person_name, label: x.expense_name }))].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8)
  // Everyone who has paid or spent, with totals
  const names = new Map(), key = n => String(n ?? '').trim().toLowerCase()
  const add = (n, f, amt) => { if (!key(n)) return; const o = names.get(key(n)) || { name: String(n).trim(), paid: 0, spent: 0 }; o[f] += Number(amt); names.set(key(n), o) }
  cols.forEach(x => add(x.person_responsible, 'paid', x.amount)); exps.forEach(x => add(x.person_name, 'spent', x.amount))
  const people = [...names.values()].sort((a, b) => (b.paid + b.spent) - (a.paid + a.spent) || a.name.localeCompare(b.name))
  return <section>
    {rem < 0 && <p className="warn">Expenses exceed the collected budget.</p>}
    <div className="cards">
      <div className="card"><span>Total collected</span><b className="in">{peso(c)}</b></div>
      <div className="card"><span>Total expenses</span><b className="out">{peso(s)}</b></div>
      <div className="card"><span>Remaining budget</span><b className={rem < 0 ? 'out' : ''}>{peso(rem)}</b></div>
      <div className="card"><span>Latest collection</span><b>{peso(cols[0]?.amount)}</b></div>
    </div>
    {extra}
    <div className="card"><h2>Names: paid and expenses</h2>
      <div className="scroll"><table><thead><tr><th>Name</th><th>Paid in</th><th>Spent</th></tr></thead><tbody>
        {people.map(o => <tr key={o.name}><td>{o.name}</td><td className="in">{o.paid ? peso(o.paid) : <span className="mute">None</span>}</td><td className="out">{o.spent ? peso(o.spent) : <span className="mute">None</span>}</td></tr>)}
        {!people.length && <tr><td colSpan={3} className="mute">No names yet. Choose a person when you record a collection or an expense.</td></tr>}
      </tbody></table></div></div>
    <h2>Recent transactions</h2>
    <div className="scroll"><table><tbody>{recent.map(r => <tr key={r.type + r.id}><td className="mute">{r.date}</td><td>{r.who || <span className="mute">No name</span>}</td><td>{r.label}</td><td className={r.type}>{r.type === 'in' ? '+' : '−'}{peso(r.amount)}</td></tr>)}</tbody></table></div>
  </section>
}

function Breakdown({ exps }) {
  const groups = useMemo(() => { const m = {}; exps.forEach(e => (m[e.person_name.trim()] ||= []).push(e)); return Object.entries(m).map(([name, list]) => ({ name, list, total: sum(list) })).sort((a, b) => b.total - a.total) }, [exps])
  return <section><h2>Expenses breakdown</h2>
    {groups.map((g, i) => <details className="card" key={g.name}><summary><b>{g.name}</b> {i === 0 && <em>highest spender</em>}<span>{g.list.length} expenses</span><b className="out">{peso(g.total)}</b></summary>
      <table><tbody>{g.list.map(e => <tr key={e.id}><td className="mute">{e.expense_date}</td><td>{e.expense_name}</td><td className="out">{peso(e.amount)}</td></tr>)}</tbody></table></details>)}
    {!groups.length && <p className="mute">No expenses recorded.</p>}
  </section>
}

function History({ cols, exps }) {
  const [type, setType] = useState(''), [q, setQ] = useState('')
  const all = [...cols.map(x => ({ id: 'C' + x.id, type: 'in', date: x.collection_date, who: x.person_responsible || '', what: x.description || `Week ${x.week_number}`, amount: x.amount })), ...exps.map(x => ({ id: 'E' + x.id, type: 'out', date: x.expense_date, who: x.person_name, what: x.expense_name, amount: x.amount }))]
    .filter(r => (!type || r.type === type) && (!q || (r.who + r.what).toLowerCase().includes(q.toLowerCase()))).sort((a, b) => b.date.localeCompare(a.date))
  return <section><div className="bar"><h2>Transaction history</h2><input placeholder="Search…" value={q} onChange={e => setQ(e.target.value)} />
    <select value={type} onChange={e => setType(e.target.value)}><option value="">All</option><option value="in">Collections</option><option value="out">Expenses</option></select></div>
    <div className="scroll"><table><tbody>{all.map(r => <tr key={r.id}><td className="mute">{r.date}</td><td className="mute">{r.id}</td><td>{r.who}</td><td>{r.what}</td><td className={r.type}>{r.type === 'in' ? '+' : '−'}{peso(r.amount)}</td></tr>)}</tbody></table></div></section>
}

const COL_FIELDS = [{ k: 'week_number', label: 'Week no.', type: 'number', req: 1 }, { k: 'collection_date', label: 'Date', type: 'date', req: 1, def: today() }, { k: 'description', label: 'Remarks' }, { k: 'amount', label: 'Amount (₱)', type: 'number', req: 1 }, { k: 'person_responsible', label: 'Person (optional)' }]
const EXP_FIELDS = [{ k: 'expense_date', label: 'Date', type: 'date', req: 1, def: today() }, { k: 'person_name', label: 'Person', req: 1 }, { k: 'category', label: 'Category' }, { k: 'expense_name', label: 'Expense', req: 1 }, { k: 'description', label: 'Details' }, { k: 'quantity', label: 'Quantity', type: 'number' }, { k: 'amount', label: 'Amount (₱)', type: 'number', req: 1 }, { k: 'receipt_reference', label: 'Receipt ref.' }, { k: 'remarks', label: 'Remarks' }]
const PAGES = ['Dashboard', 'Weekly Collections', 'Expenses', 'Expenses Breakdown', 'Transaction History']


function App() {
  const [page, setPage] = useState(0), [cols, setCols] = useState([]), [exps, setExps] = useState([]), [pay, setPay] = useState(() => db.pay()), [toast, setToast] = useState(null)
  const notify = (text, bad) => { setToast({ text, bad }); setTimeout(() => setToast(null), 3500) }
  const load = useCallback(async () => { setCols(await db.collections.list()); setExps(await db.expenses.list()); setPay(db.pay()) }, [])
  useEffect(() => { load(); window.addEventListener('storage', load); return () => window.removeEventListener('storage', load) }, [load])
  const wrap = s => ({ save: async r => { await s.save(r); await load() }, remove: async id => { await s.remove(id); await load() } })
  const available = sum(cols) - sum(exps)
  const colFields = COL_FIELDS.map(f => f.k === 'person_responsible' ? { ...f, label: 'Person', type: 'select', options: pay.members.map(m => m.name) } : f)

  const backup = () => db.exportXlsx(today())
  function restore(e) {
    const f = e.target.files[0]; if (!f) return
    if (!confirm('Restoring replaces all current data. Continue?')) { e.target.value = ''; return }
    const json = /\.json$/i.test(f.name), r = new FileReader()
    r.onload = async () => { try { json ? db.importAll(r.result) : db.importXlsx(r.result); await load(); notify('Backup restored.') } catch (err) { notify(err.message, true) } }
    json ? r.readAsText(f) : r.readAsArrayBuffer(f); e.target.value = ''
  }
  async function clearSample() { if (confirm('Remove all sample records?')) { db.clearSample(); await load(); notify('Sample data removed.') } }
  const hasSample = [...cols, ...exps].some(r => r.is_sample)

  return <div className="shell">
    <nav><b>Budget Log</b>{PAGES.map((p, i) => <button key={p} className={i === page ? 'on' : ''} onClick={() => setPage(i)}>{p}</button>)}
      <div className="who"><small>Saved in this browser only</small>
        <button onClick={backup}>Download backup (Excel)</button>
        <label className="filebtn">Restore backup<input type="file" accept=".xlsx,.json" onChange={restore} hidden /></label>
        {hasSample && <button onClick={clearSample}>Remove sample data</button>}</div></nav>
    <main>{[
      <Dashboard cols={cols} exps={exps} extra={<Checklist pay={pay} reload={load} notify={notify} />} />,
      <Crud title="Weekly collections" rows={cols} fields={colFields} show={[{ k: 'week_number', label: 'Week' }, { k: 'collection_date', label: 'Date' }, { k: 'person_responsible', label: 'Person' }, { k: 'description', label: 'Remarks' }, { k: 'amount', label: 'Amount' }]} store={wrap(db.collections)} admin={true} notify={notify} tone="in" />,
      <Crud title="Expenses" rows={exps} fields={EXP_FIELDS} show={[{ k: 'expense_date', label: 'Date' }, { k: 'person_name', label: 'Person' }, { k: 'category', label: 'Category' }, { k: 'expense_name', label: 'Expense' }, { k: 'amount', label: 'Amount' }]} store={wrap(db.expenses)} admin={true} notify={notify} tone="out" available={available} />,
      <Breakdown exps={exps} />, <History cols={cols} exps={exps} />][page]}</main>
    {toast && <div className={'toast ' + (toast.bad ? 'bad' : '')}>{toast.text}</div>}
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
